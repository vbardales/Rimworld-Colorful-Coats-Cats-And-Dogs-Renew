<!doctype html><meta charset="utf-8"><title>Preview composition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:896px;height:504px;overflow:hidden}body{font-family:"Segoe UI",system-ui,sans-serif}
.art,.veil{position:absolute;inset:0;width:896px;height:504px}.art{object-fit:cover;object-position:50% 62%}
.veil{background:radial-gradient(ellipse 1000px 760px at top left,rgba(var(--veilRGB),.94) 0%,rgba(var(--veilRGB),.90) 42%,rgba(var(--veilRGB),0) 85%)}
.copy{position:absolute;left:50px;top:54px;text-shadow:0 3px 10px rgba(0,0,0,.75)}
h1{font-size:46px;font-weight:600;line-height:1.1;letter-spacing:0;color:var(--inkPrimary);width:620px}
h1 .link-word,h1 .suffix{font-size:.65em}h1 .suffix{color:var(--inkSecondary)}
.tag{font-size:24px;font-weight:400;line-height:1.1;letter-spacing:.2px;margin-top:8px;color:var(--inkSecondary);width:max-content}
.rule{width:58px;height:3px;margin-top:20px;margin-bottom:16px;background:var(--accent)}
.summary{font-size:21px;font-weight:400;line-height:1.45;width:430px;color:var(--inkPrimary)}
.badge{position:absolute;right:0;top:0;width:80px;height:80px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%)}
.version{position:absolute;left:869px;top:27px;transform:translate(-50%,-50%) rotate(45deg);font-size:26px;font-weight:700;line-height:1;color:var(--badgeInk)}
.background-only h1,.background-only .tag,.background-only .summary,.background-only .version{visibility:hidden}
</style>
<img class="art" src="Preview.png"><div class="veil"></div>
<div class="copy"><h1 id="title"></h1><div class="tag" id="tag"></div><div class="rule"></div><p class="summary">Coat variations for the cats and dogs that still have only one.</p></div>
<div class="badge"></div><div class="version" id="version"></div>
<script>
window.ready=(async()=>{
const palette=await(await fetch('preview-palette.json')).json();
for(const [k,v] of Object.entries(palette))document.documentElement.style.setProperty('--'+k,v);
document.documentElement.style.setProperty('--veilRGB',palette.veil.slice(1).match(/../g).map(x=>parseInt(x,16)).join(','));
const about=new DOMParser().parseFromString(await(await fetch('../Mod/About/About.xml')).text(),'application/xml');
const name=about.querySelector('ModMetaData > name').textContent;
const tag=name.match(/\s*(\((?:unofficial|prohibited)\))$/);
const title=name.replace(/\s*\((?:unofficial|prohibited)\)$/,'');
const heading=document.querySelector('#title');
for(const token of title.split(/(\band\b|\bRenew\b| - )/)){
 if(token===' - '){heading.append(document.createTextNode(' -'),document.createElement('br'));}
 else if(token==='and'||token==='Renew'){const span=document.createElement('span');span.className=token==='Renew'?'suffix':'link-word';span.textContent=token;heading.append(span);}
 else heading.append(document.createTextNode(token));
}
document.querySelector('#tag').textContent=tag?tag[1]:'';if(!tag)document.querySelector('#tag').remove();
const versions=[...about.querySelectorAll('supportedVersions > li')].map(x=>x.textContent.trim()).filter(x=>/^\d+\.\d+$/.test(x)).sort((a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);return y[0]-x[0]||y[1]-x[1]});
if(!versions.length)throw Error('No stable version');document.querySelector('#version').textContent=versions[0];
await document.fonts.ready;await Promise.all([...document.images].map(x=>x.decode()));
})();
</script>
